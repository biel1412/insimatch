name: Publicar no GitHub Pages

# Publica o branch main na raiz do site e, se existir, o branch "teste-ia" em /teste/.
# O branch de teste dispara esta publicação pelo workflow "Versão de teste" (que roda nele).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: principal

      - name: Verificar se existe versão de teste
        id: teste
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" teste-ia > /dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.teste.outputs.existe == 'true'
        with:
          ref: teste-ia
          path: teste

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publicar versão principal
        run: dotnet publish principal/src/Insimatch/Insimatch.csproj -c Release -o release

      - name: Ajustar caminho base para o GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|g" release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Publicar versão de teste em /teste/
        if: steps.teste.outputs.existe == 'true'
        run: |
          REPO="${{ github.event.repository.name }}"
          dotnet publish teste/src/Insimatch/Insimatch.csproj -c Release -o release-teste
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/teste/\" />|g" release-teste/wwwroot/index.html
          mkdir -p release/wwwroot/teste
          cp -r release-teste/wwwroot/. release/wwwroot/teste/
          # Links diretos da versão de teste (ex.: /teste/admdev) voltam para ela com ?rota=
          python3 - "$REPO" <<'PY'
          import sys
          repo = sys.argv[1]
          p = 'release/wwwroot/404.html'
          s = open(p, encoding='utf-8').read()
          js = ("<script>(function(){var b='/" + repo + "/teste/',p=location.pathname;"
                "if(p.indexOf(b)===0&&p.length>b.length){location.replace(b+'?rota='+encodeURIComponent(p.slice(b.length)));}})();</script>")
          open(p, 'w', encoding='utf-8').write(s.replace('<head>', '<head>' + js, 1))
          PY

      - name: Guardar build (download manual)
        uses: actions/upload-artifact@v4
        with:
          name: insimatch-site
          path: release/wwwroot
          include-hidden-files: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
