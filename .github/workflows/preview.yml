name: Preview temporario
on:
  push:
    branches: [tmp-preview]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/Insimatch/Insimatch.csproj -c Release -o release
      - name: Enviar build para branch temporario
        run: |
          cd release/wwwroot
          git init -q
          git config user.name "preview"
          git config user.email "preview@users.noreply.github.com"
          git add -A
          git commit -q -m "build"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:tmp-preview-out
