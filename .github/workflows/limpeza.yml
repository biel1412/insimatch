name: Limpeza de ramos temporários
on:
  push:
    branches: [main]
    paths: ['.github/workflows/limpeza.yml']
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for b in teste-ia tmp-e2e-out; do git push origin --delete "$b" || true; done
